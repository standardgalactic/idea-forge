name: Docs

on:
  push:
    paths:
      - "docs/**"
      - "site/**"
      - "papers/**"
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs interface
        run: |
          make init
          make docs
